    <title>my city landing</title>

<body>

    <header>
        <div class="container">
            <div class="header__inner">
                <input type="checkbox" id="close-menu">
                <label for="close-menu">X</label>
                <nav>
                    <ul>
                        <li><a href="#">What to do?</a></li>
                        <li><a href="#">Information</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </nav>
                <label for="close-menu" class="burger">
                    <div class="burger__menu">
                        <span></span>
                    </div>
                </label>
                <a href="#" class="logo">
                    <img src="./img/logo.png" alt="logo">
                </a>
            </div>
        </div>
        <div class="header__bg">
            <img src="./img/bg.jpg" alt="header-bg">
        </div>
    </header>

    <main>
        <section class="gallary">
            <div class="container">
                <div class="gallary__inner">
                    <h1>What to do in Buenos Aires?</h1>
                    <ul aria-label="Buenos Aires Gallary">
                        <li><img src="./img/gallary-1.png" alt=""></li>
                        <li><img src="./img/gallary-2.png" alt=""></li>
                        <li><img src="./img/gallary-3.png" alt=""></li>
                        <li><img src="./img/gallary-4.png" alt=""></li>
                        <li><img src="./img/gallary-5.png" alt=""></li>
                        <li><img src="./img/gallary-6.png" alt=""></li>
                    </ul>
                </div>
            </div>
        </section>

        <section class="food">
            <div class="container">
                <div class="food__inner">
                    <h2>Reasons to come to Buenos Aires:</h2>
                    <div class="food__items">
                        <div class="gastronomy">
                            <img src="./img/food-img-1.png" alt="">
                            <div class="gastronomy__inner">
                                <h3>Gastronomy</h3>
                                <p>Not coming to Buenos Aires it’s a huge missed steak!</p>
                            </div>
                        </div>
                        <div class="culture">
                            <img src="./img/food-img-2.png" alt="">
                            <div class="culture__inner">
                                <h3>Art and culture</h3>
                                <p>you’ll find endless artistic & cultural proposals.</p>
                            </div>
                        </div>
                    </div>
                    <p>Come to Buenos Aires, we are waiting for you</p>
                </div>
            </div>
        </section>
